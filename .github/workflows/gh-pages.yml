name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Repair featured images and article colors
        run: node scripts/repair-featured-images.js

      - name: Normalize article tags
        run: node scripts/normalize-article-tags.js

      - name: Audit internal links and tags
        run: node scripts/audit-internal-links.js

      - name: Persist generated featured images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles public/img/articulo tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Generate article featured images and normalize ct colors"
            git push
          fi

      - name: Generate most-read articles from GA4
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          TOP_ARTICLES_LIMIT: 10
        run: |
          if [ -n "$GA4_PROPERTY_ID" ] && [ -n "$GA4_CREDENTIALS_JSON" ]; then
            npm run generate:top-articles
          else
            echo "GA4 secrets not configured; keeping top-articles.json unchanged."
          fi

      - name: Run tests
        run: npm test

      - name: Validate content
        run: npm run validate:content

      - name: Build static site for Pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_BASE_PATH: /
          SITE_URL: https://ayudaparamiweb.com
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
