<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Analítica web y métricas útiles</title>
  <desc id="desc">Ilustración de un panel de analítica web con gráficos, métricas y una lupa sobre los datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223b73"/>
      <stop offset="100%" stop-color="#5b78c7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0b1736" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="180" fill="#ffffff" opacity=".06"/>
  <circle cx="170" cy="760" r="240" fill="#ffffff" opacity=".05"/>

  <g filter="url(#shadow)">
    <rect x="220" y="150" width="1160" height="600" rx="34" fill="url(#card)"/>
  </g>

  <rect x="220" y="150" width="1160" height="92" rx="34" fill="#f8faff"/>
  <circle cx="278" cy="196" r="11" fill="#d3dbee"/>
  <circle cx="315" cy="196" r="11" fill="#d3dbee"/>
  <circle cx="352" cy="196" r="11" fill="#d3dbee"/>

  <text x="425" y="207" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#23345d">Rendimiento de tu web</text>

  <g>
    <rect x="290" y="294" width="250" height="120" rx="18" fill="#ffffff" stroke="#dce5f7"/>
    <text x="320" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6d91">Tráfico</text>
    <text x="320" y="386" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#23345d">+18%</text>

    <rect x="565" y="294" width="250" height="120" rx="18" fill="#ffffff" stroke="#dce5f7"/>
    <text x="595" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6d91">Contactos</text>
    <text x="595" y="386" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#23345d">42</text>

    <rect x="840" y="294" width="250" height="120" rx="18" fill="#ffffff" stroke="#dce5f7"/>
    <text x="870" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5d6d91">Clics orgánicos</text>
    <text x="870" y="386" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#23345d">1.8k</text>
  </g>

  <g>
    <rect x="290" y="454" width="800" height="210" rx="22" fill="#ffffff" stroke="#dce5f7"/>
    <line x1="335" y1="620" x2="1045" y2="620" stroke="#dfe6f5" stroke-width="2"/>
    <line x1="335" y1="565" x2="1045" y2="565" stroke="#edf1f8" stroke-width="2"/>
    <line x1="335" y1="510" x2="1045" y2="510" stroke="#edf1f8" stroke-width="2"/>
    <polyline points="345,605 430,590 515,575 600,592 685,548 770,555 855,515 940,528 1028,490"
      fill="none" stroke="#5b78c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#5b78c7">
      <circle cx="345" cy="605" r="8"/><circle cx="430" cy="590" r="8"/><circle cx="515" cy="575" r="8"/>
      <circle cx="600" cy="592" r="8"/><circle cx="685" cy="548" r="8"/><circle cx="770" cy="555" r="8"/>
      <circle cx="855" cy="515" r="8"/><circle cx="940" cy="528" r="8"/><circle cx="1028" cy="490" r="8"/>
    </g>
  </g>

  <g transform="translate(1120 485)">
    <circle cx="90" cy="90" r="72" fill="none" stroke="#23345d" stroke-width="20"/>
    <line x1="142" y1="142" x2="210" y2="210" stroke="#23345d" stroke-width="22" stroke-linecap="round"/>
    <circle cx="90" cy="90" r="38" fill="#5b78c7" opacity=".16"/>
  </g>

  <text x="800" y="822" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#ffffff" opacity=".95">
    Datos útiles para tomar mejores decisiones
  </text>
</svg>