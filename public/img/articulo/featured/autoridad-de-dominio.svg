  <linearGradient id="peach" x1="0" x2="1"><stop stop-color="#ffe4cf"/><stop offset="1" stop-color="#ffd2af"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4a2b17" flood-opacity=".14"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f47b25"/></marker>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
