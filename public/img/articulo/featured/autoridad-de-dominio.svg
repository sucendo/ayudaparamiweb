<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Autoridad de dominio</title>
<desc id="desc">Ilustración editorial naranja de una web central conectada mediante enlaces a otras webs, representando autoridad, confianza y backlinks.</desc>
<defs>
